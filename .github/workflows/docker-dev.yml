on:
  release:
    types: [published]
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 18 * * 0' # run Sundays at 18

name: Publish RStudio Docker images

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_rstudio:
    name: Build rstudio image
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: false
      load: true
      platforms: linux/amd64
      context: ./rstudio/.
      cache: true
      build-args: GITHUB_PAT=${{ github.token }}
      meta-images: rstudio
  push_devs_to_registry:
    needs: build_rstudio
    strategy:
      fail-fast: false
      matrix:
        image: [ltmv-dev, smerte-dev, ablanor-dev, noric-dev, traume-dev]
    name: Push ${{ matrix.image }} image to docker hub
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64
      context: ./${{ matrix.image }}/.
      cache: true
      build-args: |
        GITHUB_PAT=${{ github.token }}
        BASE_IMAGE=rstudio
      meta-images: rapporteket/${{ matrix.image }}
      meta-tags: |
        type=ref,event=branch
        type=schedule,pattern=weekly
        type=schedule,pattern=main
        type=semver,pattern={{major}}.{{minor}}.{{patch}}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
