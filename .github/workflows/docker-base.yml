on:
  release:
    types: [published]
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 20 * * 0' # run Sundays at 20

name: Publish base R Docker images

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  push_base_to_registry:
    strategy:
      fail-fast: false
      matrix:
        image: [base-r, base-r-alpine]
    name: Push ${{ matrix.image }} image to docker hub
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      context: ./${{ matrix.image }}/.
      cache: true
      build-args: GITHUB_PAT=${{ github.token }}
      meta-images: rapporteket/${{ matrix.image }}
      meta-tags: |
        type=ref,event=branch
        type=schedule,pattern=weekly
        type=schedule,pattern=main
        type=semver,pattern={{major}}.{{minor}}.{{patch}}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
  push_amd64only_to_registry:
    strategy:
      fail-fast: false
      matrix:
        image: [base-r-alpine-latex]
    name: Push ${{ matrix.image }} image to docker hub
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64
      context: ./${{ matrix.image }}/.
      cache: true
      build-args: GITHUB_PAT=${{ github.token }}
      meta-images: rapporteket/${{ matrix.image }}
      meta-tags: |
        type=ref,event=branch
        type=schedule,pattern=weekly
        type=schedule,pattern=main
        type=semver,pattern={{major}}.{{minor}}.{{patch}}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
